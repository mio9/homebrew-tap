name: Update formula

on:
  repository_dispatch:
    types: [update-formula]
  workflow_dispatch:
    inputs:
      formula:
        description: Formula name
        required: true
        type: choice
        options:
          - notif
          - dddns
      version:
        description: Release version (with or without v prefix)
        required: true
        type: string

permissions:
  contents: write

jobs:
  update:
    name: Update ${{ github.event.client_payload.formula || inputs.formula }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out tap
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: tap

      - name: Resolve inputs
        id: inputs
        run: |
          formula="${{ github.event.client_payload.formula || inputs.formula }}"
          version="${{ github.event.client_payload.version || inputs.version }}"
          version="${version#v}"

          if [[ ! "${formula}" =~ ^(notif|dddns)$ ]]; then
            echo "::error::Unsupported formula: ${formula}"
            exit 1
          fi

          if [[ -z "${version}" ]]; then
            echo "::error::Version is required"
            exit 1
          fi

          echo "formula=${formula}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Update formula
        working-directory: tap
        run: bash "scripts/update-${{ steps.inputs.outputs.formula }}.sh" "${{ steps.inputs.outputs.version }}"

      - name: Set up git
        uses: Homebrew/actions/git-user-config@df4b09108a1de9d6f995fe68f302b3f68bd6d2ef # 2026.07.20.1

      - name: Commit changes
        working-directory: tap
        run: |
          formula="${{ steps.inputs.outputs.formula }}"
          version="${{ steps.inputs.outputs.version }}"

          git add "Formula/${formula}.rb"
          if git diff --cached --quiet; then
            echo "Already up to date"
            exit 0
          fi

          git commit -m "${formula} ${version}"

      - name: Push commits
        uses: Homebrew/actions/git-try-push@df4b09108a1de9d6f995fe68f302b3f68bd6d2ef # 2026.07.20.1
        with:
          directory: tap
          branch: main
